# Forensic byte-exact freeze of the ORIGINAL machine's anaconda *base* env.
# >>> This file is a RECORD, not the recommended installer. To build a working,
# >>> conflict-free environment use `environment.yml` (curated + verified to resolve).
# This freeze is a kitchen-sink base env: it contains many packages the project does
# NOT use (tensorflow, flair, ray, dask, conda-build, boto3, ...). Several of them pin
# incompatible versions, so a literal `conda env create -f environment.lock.yml` will
# FAIL the resolver. The known numpy blocker: tensorflow==2.13.0 requires numpy<=1.24.3,
# which conflicts with the pinned numpy==1.26.4 -> ResolutionImpossible. The tensorflow
# lines are therefore commented out below (it is imported by zero project scripts).
# (To regenerate a clean lock: build env from environment.yml, then `pip freeze`.)
# Note: ablang==0.3.1 and antiberty==0.1.3 ARE REQUIRED -- the canonical AbLang/AntiBERTy
# embeddings (BCR + SAbDab) come from these pip packages' bundled weights, because the
# HuggingFace repos (msc-bioinformatics/AbLang, neulab/antiberty) are no longer available.
# ESM2 + TCR-BERT are loaded via transformers + HuggingFace. (None of these pin numpy, so
# they are not the lock conflict source.) ablang2/scikit-bio remain intentionally absent (legacy only).
# Note: `anarci==1.3` (data-prep CDR numbering) is recorded below as a comment only --
# it is source-installed (oxpig/ANARCI; the env shows it as pypi_0) and is NOT on PyPI,
# so a literal pip line would make `conda env create -f` fail. Install it separately
# via `conda install -c bioconda anarci hmmer` (or from source). See discussions/310.
name: embedding_benchmark_v1
channels:
  - conda-forge
  - defaults
  - pytorch
  - bioconda
  - milaboratories
  - hcc
